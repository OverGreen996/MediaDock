<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediaDock</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg><strong>MediaDock</strong></div><div class="header-actions"><button id="refresh" class="icon" aria-label="重新掃描" title="重新掃描"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button><button id="setup" class="icon" aria-label="安裝與使用說明" title="安裝與使用說明"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.7 1.8c-1.5.7-1.5 1.2-1.5 2.2M12 16h.01"/></svg></button></div></header>
  <section aria-labelledby="page-title"><div class="eyebrow"><span id="site">目前分頁</span><span id="scan-state">正在掃描</span></div><h1 id="page-title">尋找可下載的媒體</h1><p id="page-description" class="description">正在讀取目前分頁…</p></section>
  <section id="video" hidden aria-label="影片下載設定">
    <div class="field"><label for="quality">畫質</label><select id="quality" disabled><option value="best">正在取得可用畫質…</option></select></div>
    <details id="advanced"><summary>更多選項</summary><div class="advanced-content"><div class="field"><label for="mode">下載內容</label><select id="mode"><option value="video">影片＋聲音</option><option value="audio">僅音訊（原始編碼）</option></select></div><div class="field"><label for="container">影片格式</label><select id="container"><option value="mp4">MP4 · 保留原始畫質</option><option value="webm">WebM · 相容時使用</option></select></div><input id="subtitles" type="checkbox" hidden><label id="cookie-option" class="check" hidden><input id="cookies" type="checkbox" checked>使用此分頁的 Bilibili 登入權限</label><p id="cookie-hint" class="hint" hidden>登入狀態留在瀏覽器；畫質依影片和帳號權限提供。</p></div></details>
    <button id="start" class="primary full" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg>下載並選擇儲存位置</button><p class="hint save-hint">下載、驗證完成後，詢問儲存位置。保留原始編碼，容器依相容性決定。</p>
  </section>
  <section id="media" hidden aria-label="頁面媒體"><div id="media-list" class="list"></div><div class="fallback"><button id="watch" class="subtle">啟用串流偵測</button></div><p id="watch-hint" class="hint" hidden>請重新播放或載入影片，再按右上角重新掃描。</p></section>
  <div id="message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <details id="history"><summary><span>下載紀錄</span><span id="count" class="count"></span></summary><div id="jobs" class="list"></div><button id="clear" class="subtle">清除已結束紀錄</button></details>
  <footer><span id="footer-status">按需掃描 · 瀏覽器內處理</span><span>0.4.1</span></footer>
</main><script type="module" src="popup.js"></script></body></html>
